name: Build AcidBox

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-22.04 }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          OUT=build/AcidBox_artefacts/Release
          mkdir -p dist
          cp -R "$OUT/VST3/AcidBox.vst3" dist/
          [ -d "$OUT/AU" ] && cp -R "$OUT/AU/AcidBox.component" dist/
          cp -R "$OUT/Standalone/"* dist/
          cp README.md dist/
          if [ "$RUNNER_OS" = "macOS" ]; then
            for b in dist/AcidBox.vst3 dist/AcidBox.component dist/AcidBox.app; do codesign --force --deep --sign - "$b"; done
            ditto -c -k --keepParent dist AcidBox-macOS.zip
          elif [ "$RUNNER_OS" = "Linux" ]; then
            (cd dist && zip -qry ../AcidBox-Linux.zip .)
          else
            7z a -tzip AcidBox-Windows.zip ./dist/*
          fi

      # zipped first so the Mac and Linux executables keep their permissions
      - uses: actions/upload-artifact@v4
        with:
          name: AcidBox-${{ matrix.name }}
          path: AcidBox-${{ matrix.name }}.zip
